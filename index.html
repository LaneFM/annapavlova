<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анна Павлова — Йога и Телесная терапия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">


</head>

<body>

  <section class="hero">
  <div class="container">
    <!-- Левая колонка: Картинка (на ПК) -->
    <div class="hero-image"></div>
    
    <!-- Правая колонка: Текст -->
    <div class="hero-content">
      <h1 id="heroName">Анна<br>Павлова</h1>
      <ul class="hero-list" id="heroRoles">
        <!-- Роли загружаются из JS -->
      </ul>
    </div>
  </div>
</section>

  <!-- NAV -->
  <nav class="nav-bar">
    <div class="container nav-container">
      <div class="nav-current-title" id="currentSectionTitle"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Открыть меню">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <ul class="nav-links" id="navMenu">
        <li><a href="#yoga" class="nav-btn" data-section="yoga">Йога</a></li>
        <li><a href="#bodywork" class="nav-btn" data-section="bodywork">Телесная терапия</a></li>
        <li><a href="#dobayukivanie" class="nav-btn" data-section="dobayukivanie">Добаюкивание</a></li>
        <li><a href="#tours" class="nav-btn" data-section="tours">Туры и поездки</a></li>
      </ul>
    </div>
  </nav>

  <!-- ABOUT -->
  <section class="about">
    <div class="container">
      <h2 class="section-title" id="aboutTitle"></h2>
      <div class="about-text" id="aboutText"></div>
    </div>
  </section>

  <!-- YOGA -->
  <section id="yoga" class="yoga-section">
    <div class="container">
      <h2 class="section-title" id="yogaTitle"></h2>
      <p class="section-desc" id="yogaDesc"></p>
      <div class="cards-grid-3" id="yogaCards"></div>
    </div>
  </section>

  <!-- BODYWORK -->
  <section id="bodywork" class="container">
    <div class="bodywork-hero">
      <div class="bodywork-content">
        <h2 id="bodyworkTitle"></h2>
        <p id="bodyworkDesc"></p>
        <a href="#" id="bodyworkBtn" target="_blank" class="btn" style="background-color: var(--white); color: var(--text-dark);"></a>
      </div>
    </div>
    <div class="reviews-section">
      <h3 style="font-size: 22px; margin-bottom: 24px;" id="reviewsTitle"></h3>
      <div class="cards-grid-3" id="reviewsGrid"></div>
    </div>
  </section>

  <!-- DOBAYUKIVANIE -->
  <section id="dobayukivanie" class="dobayukivanie-section">
    <div class="container">
      <h2 class="section-title" id="dobayukiTitle"></h2>
      <p class="section-desc" id="dobayukiDesc"></p>
      <div class="dobayuki-grid">
        <div class="booking-form">
          <h3 style="margin-bottom: 20px;" id="formTitle"></h3>
          <form onsubmit="event.preventDefault(); alert('Спасибо за заявку!');">
            <div class="form-group">
              <label id="labelName" for="name"></label>
              <input type="text" id="name" required>
            </div>
            <div class="form-group">
              <label id="labelPhone" for="phone"></label>
              <input type="tel" id="phone" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;" id="formSubmitBtn"></button>
          </form>
        </div>
        <div class="image-grid">
          <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=500&q=80" alt="Галерея 1">
          <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=500&q=80" alt="Галерея 2">
          <img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=500&q=80" alt="Галерея 3">
          <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=500&q=80" alt="Галерея 4">
        </div>
      </div>
    </div>
  </section>

  <!-- TOURS -->
  <section id="tours" class="tours-section">
    <div class="container">
      <h2 class="section-title" id="toursTitle"></h2>
      <p class="section-desc" id="toursDesc"></p>
      <div class="cards-grid-3" id="toursGrid"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <h4 id="footerName"></h4>
          <div id="footerBio"></div>
        </div>
        <div class="footer-col">
          <h4 id="footerContactsTitle"></h4>
          <p id="footerPhone"></p>
          <p id="footerEmail"></p>
          <a href="#" id="footerTaplink" target="_blank">Taplink профиль</a>
        </div>
        <div class="footer-col">
          <h4 id="footerLocationsTitle"></h4>
          <div id="footerLocations"></div>
        </div>
      </div>
      <div class="footer-bottom" id="footerCopyright"></div>
    </div>
  </footer>

  <!-- 1. Подключение файла с текстом -->
  <script src="content.js"></script>

  <!-- 2. Скрипт подстановки текстов и работы меню -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Загрузка JSON и отрисовка контента
    fetch('content.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Ошибка загрузки JSON: ${response.status}`);
        }
        return response.json();
      })
      .then(siteContent => {
        // --- ОТРИСОВКА КОНТЕНТА ИЗ content.json ---
        
        // Hero
        document.getElementById('heroName').innerHTML = siteContent.hero.name;
        document.getElementById('heroRoles').innerHTML = siteContent.hero.roles.map(role => `<li>${role}</li>`).join('');

        // About
        document.getElementById('aboutTitle').textContent = siteContent.about.title;
        document.getElementById('aboutText').innerHTML = siteContent.about.paragraphs.map(p => `<p>${p}</p>`).join('');

        // Yoga
        document.getElementById('yogaTitle').textContent = siteContent.yoga.title;
        document.getElementById('yogaDesc').textContent = siteContent.yoga.description;
        document.getElementById('yogaCards').innerHTML = siteContent.yoga.cards.map(card => `
          <div class="card">
            <div>
              <h3>${card.title}</h3>
              <p>${card.address}</p>
            </div>
            <a href="${card.buttonUrl}" target="_blank" class="btn">${card.buttonText}</a>
          </div>
        `).join('');

        // Bodywork
        document.getElementById('bodyworkTitle').textContent = siteContent.bodywork.title;
        document.getElementById('bodyworkDesc').textContent = siteContent.bodywork.description;
        const bodyworkBtn = document.getElementById('bodyworkBtn');
        bodyworkBtn.textContent = siteContent.bodywork.buttonText;
        bodyworkBtn.href = siteContent.bodywork.buttonUrl;

        document.getElementById('reviewsTitle').textContent = siteContent.bodywork.reviewsTitle;
        document.getElementById('reviewsGrid').innerHTML = siteContent.bodywork.reviews.map(r => `
          <div class="review-card">
            <p>${r.text}</p>
            <div class="review-author">${r.author}</div>
          </div>
        `).join('');

        // Dobayukivanie
        document.getElementById('dobayukiTitle').textContent = siteContent.dobayukivanie.title;
        document.getElementById('dobayukiDesc').textContent = siteContent.dobayukivanie.description;
        document.getElementById('formTitle').textContent = siteContent.dobayukivanie.formTitle;
        document.getElementById('labelName').textContent = siteContent.dobayukivanie.nameLabel;
        document.getElementById('name').placeholder = siteContent.dobayukivanie.namePlaceholder;
        document.getElementById('labelPhone').textContent = siteContent.dobayukivanie.phoneLabel;
        document.getElementById('phone').placeholder = siteContent.dobayukivanie.phonePlaceholder;
        document.getElementById('formSubmitBtn').textContent = siteContent.dobayukivanie.submitButtonText;

        // Tours
        document.getElementById('toursTitle').textContent = siteContent.tours.title;
        document.getElementById('toursDesc').textContent = siteContent.tours.description;
        document.getElementById('toursGrid').innerHTML = siteContent.tours.items.map((tour, idx) => `
          <div class="tour-card tour-card-${idx}">
            <div>
              <h3>${tour.title}</h3>
              <p>${tour.description}</p>
            </div>
            <a href="${tour.buttonUrl}" target="_blank" class="btn btn-outline">${tour.buttonText}</a>
          </div>
        `).join('');

        // Footer
        document.getElementById('footerName').textContent = siteContent.footer.name;
        document.getElementById('footerBio').innerHTML = siteContent.footer.bio.map(b => `<p>${b}</p>`).join('');
        document.getElementById('footerContactsTitle').textContent = siteContent.footer.contactsTitle;
        document.getElementById('footerPhone').textContent = `Телефон: ${siteContent.footer.phone}`;
        document.getElementById('footerEmail').textContent = `Email: ${siteContent.footer.email}`;
        document.getElementById('footerTaplink').href = siteContent.footer.taplinkUrl;
        document.getElementById('footerLocationsTitle').textContent = siteContent.footer.locationsTitle;
        document.getElementById('footerLocations').innerHTML = siteContent.footer.locations.map(loc => `<p>${loc}</p>`).join('');
        document.getElementById('footerCopyright').textContent = siteContent.footer.copyright;
      })
      .catch(error => console.error('Ошибка при загрузке контента:', error));

    // --- ЛОГИКА МОБИЛЬНОЙ НАВИГАЦИИ С ВЫПАДАЮЩИМ НАЗВАНИЕМ ---
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    const navButtons = document.querySelectorAll('.nav-btn');
    const currentTitleEl = document.getElementById('currentSectionTitle');

    const sectionTitles = {
      'yoga': 'Йога',
      'bodywork': 'Телесная терапия',
      'dobayukivanie': 'Добаюкивание',
      'tours': 'Туры и поездки'
    };

    const toggleMenu = () => {
      navToggle.classList.toggle('active');
      navMenu.classList.toggle('active');
    };

    if (navToggle) navToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
    navButtons.forEach(link => link.addEventListener('click', () => { if (navMenu.classList.contains('active')) toggleMenu(); }));
    document.addEventListener('click', (e) => {
      if (navMenu && !navMenu.contains(e.target) && !navToggle.contains(e.target) && navMenu.classList.contains('active')) {
        toggleMenu();
      }
    });

    const isMobile = () => window.innerWidth <= 768;
    const observer = new IntersectionObserver((entries) => {
      if (!isMobile()) return;
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          if (sectionTitles[id] && currentTitleEl) {
            currentTitleEl.textContent = sectionTitles[id];
            currentTitleEl.classList.add('visible');
          }
        }
      });
    }, { rootMargin: '-20% 0px -60% 0px' });

    document.querySelectorAll('section[id]').forEach(section => observer.observe(section));
    window.addEventListener('scroll', () => {
      if (isMobile() && window.scrollY < 300 && currentTitleEl) {
        currentTitleEl.classList.remove('visible');
      }
    });
  });
</script>
</body>

</html>
